services:
  # ==============================================================================
  # 1. CORE ULTRA-LIGHTWEIGHT BACKUP DAEMON (~18MB RAM)
  # Chạy ngầm êm ái, bảo mật AES-256 Zero-Knowledge, 2-way Bot Remote Control
  # Chỉ cần: TELEGRAM_BOT_TOKEN & TELEGRAM_CHAT_ID trong file .env
  # ==============================================================================
  televault:
    build:
      context: ./daemon
      dockerfile: Dockerfile
    container_name: televault_core_daemon
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8089/api/status\", timeout=5)' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - TZ=${TIMEZONE:-Asia/Ho_Chi_Minh}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - NAS_SOURCE_PATH=/source_data
      - ENCRYPTION_PASSWORD=${ENCRYPTION_PASSWORD:-}
      - BW_LIMIT_MB=${BW_LIMIT_MB:-5.0}
      - CHUNK_SIZE_MB=${CHUNK_SIZE_MB:-45}
      - SCAN_INTERVAL_MIN=${SCAN_INTERVAL_MIN:-60}
      - API_PORT=8089
    volumes:
      - ${NAS_SOURCE_PATH:-/volume1/Photos}:/source_data:ro
      - ./data:/data
      - ./logs:/logs
      - ./.env:/app/.env
    ports:
      - "8089:8089"
    networks:
      - teldrive_net

  # ==============================================================================
  # 2. SYNOTELE VAULT PRO WEB DASHBOARD (NGINX EDGE-TO-EDGE UI)
  # Tối ưu 100% không gian màn hình, File Station & Time Machine Explorer
  # ==============================================================================
  dashboard:
    image: nginx:alpine
    container_name: teldrive_dashboard
    restart: unless-stopped
    depends_on:
      - televault
    ports:
      - "${DASHBOARD_PORT:-8088}:80"
    volumes:
      - ./dashboard:/usr/share/nginx/html:ro
      - ./dashboard/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - teldrive_net

  # ==============================================================================
  # 3. ENTERPRISE OPTIONAL SERVICES (Teldrive v2 + Rclone Crypt + Postgres)
  # Khởi chạy chế độ này khi cần lưu trữ MTProto 2GB Part:
  # docker compose --profile enterprise up -d
  # ==============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: teldrive_postgres
    restart: unless-stopped
    profiles:
      - enterprise
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-teldrive}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-teldrive_secure_pass}
      POSTGRES_DB: ${POSTGRES_DB:-teldrive}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-teldrive} -d ${POSTGRES_DB:-teldrive}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - teldrive_net

  teldrive:
    image: ghcr.io/tgdrive/teldrive:2
    container_name: teldrive_server
    restart: unless-stopped
    profiles:
      - enterprise
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${TELDRIVE_PORT:-8080}:8080"
    volumes:
      - ./config.toml:/config.toml:ro
      - ./data:/data
    networks:
      - teldrive_net

  rclone-backup:
    image: rclone/rclone:latest
    container_name: teldrive_rclone_cron
    restart: unless-stopped
    profiles:
      - enterprise
    depends_on:
      - teldrive
    environment:
      - TZ=${TIMEZONE:-Asia/Ho_Chi_Minh}
      - CRON_SCHEDULE=${BACKUP_CRON:-0 2 * * *}
      - RCLONE_REMOTE=${RCLONE_DEST_REMOTE:-teldrive-crypt:nas-backup}
      - RCLONE_BWLIMIT=${RCLONE_BWLIMIT:-07:00,5M 23:00,18M}
      - RCLONE_TRANSFERS=${RCLONE_TRANSFERS:-2}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
    volumes:
      - ${NAS_SOURCE_PATH:-/mnt/nas/data}:/source_data:ro
      - ./rclone/rclone.conf:/config/rclone/rclone.conf:ro
      - ./logs:/logs
      - ./scripts/container_backup.sh:/container_backup.sh:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "$$CRON_SCHEDULE /bin/sh /container_backup.sh >> /logs/cron.log 2>&1" > /etc/crontabs/root
        echo "=== [Rclone Backup Daemon Started (Trickle Mode)] ==="
        echo "Schedule: $$CRON_SCHEDULE"
        echo "Destination: $$RCLONE_REMOTE"
        crond -f -l 2
    networks:
      - teldrive_net

volumes:
  postgres_data:
    name: teldrive_postgres_data

networks:
  teldrive_net:
    name: teldrive_network

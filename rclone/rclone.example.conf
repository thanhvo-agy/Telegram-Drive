# ==============================================================================
# Rclone Configuration Template for Teldrive + Zero-Knowledge Crypt
#
# Path: rclone/rclone.conf
#
# Tip: Generate encrypted/obscured passwords using:
#   rclone obscure "YourRawPassword"
# ==============================================================================

# 1. Base WebDAV connection to Teldrive
[teldrive]
type = webdav
# Inside docker compose network use http://teldrive:8080/ui/api/v1/webdav/
# From host/NAS use http://localhost:8080/ui/api/v1/webdav/
url = http://teldrive:8080/ui/api/v1/webdav/
vendor = other
user = your_telegram_username
# Generated via `rclone obscure "YOUR_TELDRIVE_ACCESS_TOKEN_OR_PASSWORD"`
pass = 

# 2. Encrypted Overlay (Rclone Crypt) - Zero-Knowledge Encryption
# All files and folder names are encrypted with AES-256 before being sent to Telegram.
[teldrive-crypt]
type = crypt
remote = teldrive:nas-backup
filename_encryption = standard
directory_name_encryption = true
# Primary encryption password (generate with: rclone obscure "YourStrongPassphrase")
password = 
# Optional salt password
password2 = 
